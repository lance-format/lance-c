name: Set up protoc
description: Install checksum-verified protoc for Linux x86_64 or aarch64
inputs:
  install-prefix:
    description: Prefix for the protoc binary and bundled .proto includes
    required: false
    default: /usr/local
runs:
  using: composite
  steps:
    - name: Install protoc
      shell: bash
      env:
        PROTOC_VERSION: "25.3"
        PROTOC_INSTALL_PREFIX: ${{ inputs.install-prefix }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
