name: Windows CRT product validation

on:
  push:
    branches:
      - xuanwo/windows-static-crt-release

permissions:
  contents: read

jobs:
  build-windows:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            generator: Visual Studio 17 2022
            architecture: x64
            toolset: ""
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            generator: Visual Studio 18 2026
            architecture: ARM64
            toolset: ClangCL
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Assert native Windows ARM64 toolchain
        if: matrix.architecture == 'ARM64'
        shell: pwsh
        run: pwsh -File .github/scripts/assert-windows-arm64-host.ps1
      - name: Record Windows runtime baseline
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, OSArchitecture |
            Format-List
          rustc --version --verbose
          cargo --version
          cmake --version
      - name: Install protoc
        shell: pwsh
        run: |
          $version = '29.3'
          $archive = "protoc-$version-win64.zip"
          Invoke-WebRequest `
            "https://github.com/protocolbuffers/protobuf/releases/download/v$version/$archive" `
            -OutFile "$env:RUNNER_TEMP\$archive"
          Expand-Archive "$env:RUNNER_TEMP\$archive" `
            -DestinationPath "$env:RUNNER_TEMP\protoc" -Force
          "$env:RUNNER_TEMP\protoc\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:RUNNER_TEMP\protoc\bin\protoc.exe" --version
      - name: Test Windows dependency guard
        run: pwsh -File .github/scripts/test-windows-runtime-dependencies.ps1
      - name: Configure
        run: >
          cmake -S . -B build -G "${{ matrix.generator }}"
          -A ${{ matrix.architecture }}
          ${{ matrix.toolset != '' && format('-T {0}', matrix.toolset) || '' }}
          -DCMAKE_BUILD_TYPE=Release -DLANCE_C_CRT_STATIC=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Install to staging prefix
        run: cmake --install build --prefix stage --config Release
      - name: Verify staged package and installed consumers
        run: >
          pwsh -File .github/scripts/verify-windows-staging.ps1
          -Prefix stage -SourceRoot .
          -WorkDir "$env:RUNNER_TEMP\lance-c-windows-${{ matrix.architecture }}-acceptance"
          -Architecture ${{ matrix.architecture }}
          -CMakeGenerator "${{ matrix.generator }}"
          -CMakeToolset "${{ matrix.toolset }}"
      - name: Record package identity
        shell: pwsh
        run: |
          Get-FileHash stage\lib\lance_c.dll, stage\lib\lance_c.lib,
            stage\lib\lance_c.dll.lib -Algorithm SHA256 | Format-List
          Get-ChildItem -LiteralPath stage -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
              $relative = $_.FullName.Substring((Resolve-Path stage).Path.Length + 1)
              "$hash  $relative"
            }
