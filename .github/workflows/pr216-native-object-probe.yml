name: PR216 native object export probe

on:
  push:
    branches:
      - xuanwo/pr216-native-object-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run MSVC archive-member export probe
        shell: cmd
        run: >
          .github\scripts\pr216-native-object-probe.cmd
          "%RUNNER_TEMP%\pr216-native-object-probe"
      - name: Assert probe results
        shell: pwsh
        run: >
          pwsh -File .github/scripts/test-pr216-native-object-probe.ps1
          -WorkDir "$env:RUNNER_TEMP\pr216-native-object-probe"
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr216-native-object-probe
          path: ${{ runner.temp }}/pr216-native-object-probe
          if-no-files-found: warn
  cargo:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Build probe through Cargo linker wrapper
        shell: pwsh
        run: |
          cargo build --release `
            --manifest-path .github/probe/cargo/Cargo.toml
      - name: Load Visual Studio tools
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS=%%i"
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          echo %PATH%>>"%GITHUB_PATH%"
      - name: Assert Cargo artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path "$env:RUNNER_TEMP\pr216-cargo-probe" | Out-Null
          pwsh -File .github/scripts/test-pr216-cargo-linker.ps1 `
            -ManifestPath .github/probe/cargo/Cargo.toml `
            -WorkDir "$env:RUNNER_TEMP\pr216-cargo-probe"
