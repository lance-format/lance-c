name: PR216 native object export probe

on:
  push:
    branches:
      - xuanwo/pr216-native-object-probe
  workflow_dispatch:
    inputs:
      correction_sha:
        description: Correction commit to exercise
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run MSVC archive-member export probe
        shell: cmd
        run: >
          .github\scripts\pr216-native-object-probe.cmd
          "%RUNNER_TEMP%\pr216-native-object-probe"
      - name: Assert probe results
        shell: pwsh
        run: >
          pwsh -File .github/scripts/test-pr216-native-object-probe.ps1
          -WorkDir "$env:RUNNER_TEMP\pr216-native-object-probe"
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr216-native-object-probe
          path: ${{ runner.temp }}/pr216-native-object-probe
          if-no-files-found: warn
  cargo:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Build probe through Cargo linker wrapper
        shell: pwsh
        env:
          LANCE_C_WINDOWS_EXPORT_LOG: ${{ runner.temp }}\pr216-cargo-link.log
        run: |
          cargo build -vv --release `
            --manifest-path .github/probe/cargo/Cargo.toml
      - name: Load Visual Studio tools
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS=%%i"
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          echo %PATH%>>"%GITHUB_PATH%"
      - name: Assert Cargo artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path "$env:RUNNER_TEMP\pr216 cargo probe" | Out-Null
          pwsh -File .github/scripts/test-pr216-cargo-linker.ps1 `
            -ManifestPath .github/probe/cargo/Cargo.toml `
            -WorkDir "$env:RUNNER_TEMP\pr216 cargo probe"
      - name: Upload cargo probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr216-cargo-linker-probe
          path: |
            .github/probe/cargo/target/release
            ${{ runner.temp }}/pr216 cargo probe
            ${{ runner.temp }}/pr216-cargo-link.log
          if-no-files-found: warn
  cargo-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Build native ARM64 probe through Cargo linker wrapper
        shell: pwsh
        env:
          LANCE_C_WINDOWS_EXPORT_LOG: ${{ runner.temp }}\pr216-cargo-arm64-link.log
        run: |
          cargo build -vv --release `
            --manifest-path .github/probe/cargo/Cargo.toml
      - name: Load Visual Studio ARM64 tools
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath`) do set "VS=%%i"
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=arm64 -host_arch=arm64
          echo %PATH%>>"%GITHUB_PATH%"
      - name: Assert native ARM64 Cargo artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path "$env:RUNNER_TEMP\pr216 arm64 cargo probe" | Out-Null
          pwsh -File .github/scripts/test-pr216-cargo-linker.ps1 `
            -ManifestPath .github/probe/cargo/Cargo.toml `
            -WorkDir "$env:RUNNER_TEMP\pr216 arm64 cargo probe" `
            -Machine ARM64
      - name: Upload native ARM64 cargo probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr216-cargo-linker-arm64-probe
          path: |
            .github/probe/cargo/target/release
            ${{ runner.temp }}/pr216 arm64 cargo probe
            ${{ runner.temp }}/pr216-cargo-arm64-link.log
          if-no-files-found: warn
  product-regression:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
          - architecture: ARM64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.correction_sha }}
      - name: Run product Windows export regression
        shell: pwsh
        run: |
          pwsh -File .github/scripts/test-windows-export-linker.ps1 `
            -Architecture ${{ matrix.architecture }} `
            -WorkDir "$env:RUNNER_TEMP\pr216 product ${{ matrix.architecture }} export linker"
  corrosion-install:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
            generator: Visual Studio 17 2022
            toolset: ""
          - architecture: ARM64
            runner: windows-11-arm
            generator: Visual Studio 18 2026
            toolset: ClangCL
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.correction_sha }}
          path: correction
      - name: Configure Corrosion export probe
        shell: pwsh
        run: >
          cmake -S .github/probe/corrosion -B build-corrosion
          -G "${{ matrix.generator }}"
          -A ${{ matrix.architecture }}
          ${{ matrix.toolset != '' && format('-T {0}', matrix.toolset) || '' }}
          -DPROBE_CRATE_DIR="${{ github.workspace }}/.github/probe/cargo"
          -DLANCE_C_SOURCE_DIR="${{ github.workspace }}/correction"
      - name: Build Corrosion export probe
        shell: pwsh
        run: cmake --build build-corrosion --config Release --parallel 4
      - name: Install Corrosion export probe
        shell: pwsh
        run: cmake --install build-corrosion --prefix stage-corrosion --config Release
      - name: Verify installed Corrosion artifacts
        shell: pwsh
        run: |
          pwsh -File .github/scripts/test-pr216-corrosion-install.ps1 `
            -Prefix stage-corrosion -Architecture ${{ matrix.architecture }}
