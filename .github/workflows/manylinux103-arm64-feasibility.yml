name: manylinux 2.28 ARM64 feasibility

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_COMMIT: 9d7fda2c9513a468aafb762c16e1aa0e6dc56309
  IMAGE_REF: quay.io/pypa/manylinux_2_28_aarch64@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21
  RUNNER_LABEL: ubuntu-24.04-arm

jobs:
  validate:
    name: manylinux_2_28 aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert native ARM64 runner
        run: |
          test "$(uname -m)" = aarch64
          test "$RUNNER_ARCH" = ARM64
          docker version

      - name: Record workflow identity
        run: |
          root="$RUNNER_TEMP/manylinux103-arm64"
          mkdir -p "$root/evidence"
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo "workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "event=$GITHUB_EVENT_NAME"
            echo "ref=$GITHUB_REF"
            echo "ref_name=$GITHUB_REF_NAME"
            echo "validation_commit=$GITHUB_SHA"
            echo "source_commit=$SOURCE_COMMIT"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_label=$RUNNER_LABEL"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_os=$RUNNER_OS"
            echo "image_ref=$IMAGE_REF"
          } >"$root/evidence/workflow-identity.txt"

      - name: Run manylinux ARM64 feasibility
        run: |
          bash validation/manylinux103-arm64-feasibility/run.sh \
            --source "$GITHUB_WORKSPACE" \
            --root "$RUNNER_TEMP/manylinux103-arm64" \
            --product-commit "$SOURCE_COMMIT"

      - name: Upload retained evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manylinux103-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manylinux103-arm64/evidence
          if-no-files-found: warn
          retention-days: 30
