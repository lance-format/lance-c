# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: Copyright The Lance Authors

name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Skip DWARF debug info in dev/test profiles (previously set implicitly by
  # actions-rust-lang/setup-rust-toolchain) to cut compile/link I/O in half and
  # keep target/debug/liblance_c.a (~2 GiB) under macOS lipo's 4 GiB limit.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  lint:
    name: Format & License
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Check SPDX license headers
        run: |
          MISSING=""
          for f in $(find src tests include cmake examples .github/scripts -type f \( \
            -name '*.rs' -o -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \
            -o -name '*.cmake' -o -name 'CMakeLists.txt' -o -name '*.py' -o -name '*.sh' \
          \)) build.rs CMakeLists.txt Cargo.toml; do
            if ! head -5 "$f" | grep -q 'SPDX-License-Identifier'; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "Missing SPDX license header in:$MISSING"
            exit 1
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:d086f64cddcace250ef0f0073583c51b8298159303290a730c9f59bd91edfd2c
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-protoc
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:d086f64cddcace250ef0f0073583c51b8298159303290a730c9f59bd91edfd2c
    # A cold Lance pin builds for ~12 minutes and runs the C/C++ and installed
    # consumer checks for another ~7-11. The first main run after a Cargo.lock
    # or pin change must also save the multi-gigabyte target cache, which takes
    # ~17 minutes; measured totals are 39m23s (`a800fd5`, completed) and 45m03s
    # (`ed635e2`, killed by the former 45-minute cap during that save). Keep the
    # cap above the cold-build plus first-save worst case; warm main runs skip
    # the save and still finish in ~13 minutes.
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # PR runs skip saving the multi-gigabyte target cache. Main saves it
          # once for later PR restores, matching the other cached jobs.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Clang 20
        run: manylinux-install-clang -v 20.1.8.0
      - name: Ensure pkg-config
        run: command -v pkg-config >/dev/null || dnf install -y pkgconf-pkg-config
      - name: Compile public headers with GCC and Clang
        run: bash .github/scripts/verify-cxx-headers.sh
      - uses: ./.github/actions/setup-protoc
      - name: Build library artifacts
        run: cargo build --lib
      - name: Verify shared-library exports
        run: bash .github/scripts/verify-shared-exports.sh target/debug/liblance_c.so include/lance linux .github/abi-baseline/v0.2.0-exports.txt
      - name: Test export baseline verification
        run: bash .github/scripts/test-shared-exports-baseline.sh linux
      - name: Run tests
        run: cargo test
      - name: Run C/C++ compilation tests
        run: cargo test --test compile_and_run_test -- --ignored
      - name: Verify CMake package and consumer linkage
        run: bash .github/scripts/verify-cmake-consumer.sh --from-target-dir target/debug
      - name: Verify GCC C11 and C++20 consumers
        shell: bash
        run: |
          gcc -std=c11 -Wall -Wextra -Iinclude examples/c-scan/main.c \
            -Ltarget/debug -llance_c -Wl,-rpath,"$PWD/target/debug" \
            -o target/debug/c-scan-gcc
          target/debug/c-scan-gcc test_data/v0.27.1/pq_in_schema |
            grep -Fx "rows: 512, version: 2"
          g++ -std=c++20 -Wall -Wextra -pthread -Iinclude \
            examples/cmake-consumer/main.cpp \
            -Ltarget/debug -llance_c -Wl,-rpath,"$PWD/target/debug" \
            -o target/debug/cmake-consumer-gcc
          target/debug/cmake-consumer-gcc test_data/v0.27.1/pq_in_schema |
            grep -Fx "rows: 512, version: 2"

  test-sanitizers:
    name: Tests (Linux, sanitizers)
    runs-on: ubuntu-24.04
    # The manylinux static Clang ships without compiler-rt sanitizer runtimes.
    # This test-only job uses the standard Ubuntu packages for a matching
    # Clang 20 + libclang-rt-20-dev pair; release and glibc-pinned jobs stay on
    # the manylinux image.
    timeout-minutes: 60
    env:
      CC: clang-20
      CXX: clang++-20
      LANCE_C_SANITIZERS: address,undefined
      # AddressSanitizer includes LeakSanitizer on Linux. These settings apply
      # to the native consumer binaries; the Rust library is not instrumented.
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Install Clang 20 and matching sanitizer runtimes
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" |
            sudo tee /etc/apt/sources.list.d/llvm-20.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-20 libclang-rt-20-dev pkg-config
          "$CC" --version
          "$CC" -print-resource-dir
      - uses: ./.github/actions/setup-protoc
        with:
          install-prefix: ${{ runner.temp }}/protoc
      - name: Verify protoc include discovery
        run: |
          cat > "$RUNNER_TEMP/protoc-smoke.proto" <<'SMOKE'
          syntax = "proto3";
          package smoke;
          import "google/protobuf/timestamp.proto";
          message Smoke {
              google.protobuf.Timestamp at = 1;
          }
          SMOKE
          command -v protoc
          protoc --version
          protoc --proto_path="$RUNNER_TEMP" \
            --descriptor_set_out=/dev/null "$RUNNER_TEMP/protoc-smoke.proto"
      - name: Verify sanitizer runtime links and runs
        run: |
          cat > /tmp/sanitizer-smoke.c <<'SMOKE'
          #include <stdlib.h>
          int main(void) {
              char *p = malloc(8);
              p[0] = 0;
              free(p);
              return 0;
          }
          SMOKE
          cat > /tmp/sanitizer-smoke.cpp <<'SMOKE'
          #include <cstdlib>
          int main() {
              char *p = static_cast<char *>(std::malloc(8));
              p[0] = 0;
              std::free(p);
              return 0;
          }
          SMOKE
          "$CC" -fsanitize=address,undefined -fno-sanitize-recover=all -g \
            /tmp/sanitizer-smoke.c -o /tmp/sanitizer-smoke-c
          /tmp/sanitizer-smoke-c
          "$CXX" -std=c++20 -fsanitize=address,undefined \
            -fno-sanitize-recover=all -g \
            /tmp/sanitizer-smoke.cpp -o /tmp/sanitizer-smoke-cpp
          /tmp/sanitizer-smoke-cpp
      - name: Run C consumer under sanitizers
        run: cargo test --test compile_and_run_test -- --ignored test_c_compilation_and_execution
      - name: Run C++ consumer under sanitizers
        run: cargo test --test compile_and_run_test -- --ignored test_cpp_compilation_and_execution

  test-macos:
    name: Tests (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: ${{ github.workspace }}/.github/scripts/limit-macos-exports.sh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: brew install protobuf pkgconf
      - name: Record macOS host and toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          "$CC" --version
          rustc -vV
          cargo --version
          cmake --version
          git rev-parse HEAD
      - name: Test macOS export linker arguments
        run: python3 .github/scripts/test-macos-exports.py
      - name: Build library artifacts
        run: cargo build --lib
      - name: Verify shared-library exports
        run: bash .github/scripts/verify-shared-exports.sh target/debug/liblance_c.dylib include/lance macos .github/abi-baseline/v0.2.0-exports.txt
      - name: Test export baseline verification
        run: bash .github/scripts/test-shared-exports-baseline.sh macos
      - name: Report and free cached test build headroom
        run: bash .github/scripts/free-macos-consumer-space.sh target/debug
      - name: Run tests
        run: cargo test
      - name: Run C/C++ compilation tests
        run: cargo test --test compile_and_run_test -- --ignored
      - name: Report and free package-verification disk headroom
        run: bash .github/scripts/free-macos-consumer-space.sh target/debug
      - name: Verify installed package and consumer data read
        run: bash .github/scripts/verify-cmake-consumer.sh --from-target-dir target/debug

  test-windows:
    name: Tests (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Enable long paths for Lance dependency checkout
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Corrosion writes dependencies under the CMake build tree.
          workspaces: |
            . -> target
            . -> build/x64/Release/cargo/build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Record Windows runtime baseline
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, OSArchitecture |
            Format-List
          rustc --version --verbose
          cmake --version
      - name: Install protoc
        shell: pwsh
        run: |
          $version = '29.3'
          $archive = "protoc-$version-win64.zip"
          Invoke-WebRequest `
            "https://github.com/protocolbuffers/protobuf/releases/download/v$version/$archive" `
            -OutFile "$env:RUNNER_TEMP\$archive"
          Expand-Archive "$env:RUNNER_TEMP\$archive" `
            -DestinationPath "$env:RUNNER_TEMP\protoc" -Force
          "$env:RUNNER_TEMP\protoc\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:RUNNER_TEMP\protoc\bin\protoc.exe" --version
      - name: Test Windows dependency guard
        run: |
          pwsh -File .github/scripts/test-windows-runtime-dependencies.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File .github/scripts/test-windows-import-exports.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File .github/scripts/test-windows-export-baseline.ps1
      - name: Test Windows export linker
        run: >
          pwsh -File .github/scripts/test-windows-export-linker.ps1
          -Architecture x64
          -WorkDir "$env:RUNNER_TEMP\windows export linker"
      - name: Test prebuilt CRT metadata
        run: >
          cmake "-DTEST_ROOT=$env:RUNNER_TEMP\prebuilt-crt"
          "-DTEST_GENERATOR=Visual Studio 17 2022" -DTEST_PLATFORM=x64
          -P cmake/test_prebuilt_crt.cmake
      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=Release -DLANCE_C_CRT_STATIC=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Install to staging prefix
        run: cmake --install build --prefix stage --config Release
      - name: Verify staged package and installed consumers
        run: >
          pwsh -File .github/scripts/verify-windows-staging.ps1
          -Prefix stage -SourceRoot .
          -WorkDir "$env:RUNNER_TEMP\lance-c-windows-acceptance"
          -AbiBaseline ".github/abi-baseline/v0.2.0-exports.txt"
      # Package acceptance above covers the Release CMake build. The Rust test
      # suite and the C/C++ FFI harness build their own debug library, so run
      # them after the staged-package evidence has been produced.
      - name: Run Rust tests
        run: cargo test
      - name: Run C/C++ compilation tests
        run: cargo test --test compile_and_run_test -- --ignored
      - name: Upload staged package
        uses: actions/upload-artifact@v4
        with:
          name: lance-c-windows-x86_64-pc-windows-msvc
          path: stage
          if-no-files-found: error
          retention-days: 14

  test-windows-arm64:
    name: Tests (Windows ARM64)
    runs-on: windows-11-arm
    timeout-minutes: 240
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Enable long paths for Lance dependency checkout
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Assert native Windows ARM64 toolchain
        shell: pwsh
        run: pwsh -File .github/scripts/assert-windows-arm64-host.ps1
      - name: Record Windows runtime baseline
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, OSArchitecture |
            Format-List
          rustc --version --verbose
          cargo --version
          cmake --version
      - name: Install protoc x64 build tool
        shell: pwsh
        run: |
          # protoc 29.3 has no Windows ARM64 archive. This x64 executable is a
          # code-generation tool only; the Rust and C++ build targets are native.
          $version = '29.3'
          $archive = "protoc-$version-win64.zip"
          Invoke-WebRequest `
            "https://github.com/protocolbuffers/protobuf/releases/download/v$version/$archive" `
            -OutFile "$env:RUNNER_TEMP\$archive"
          Expand-Archive "$env:RUNNER_TEMP\$archive" `
            -DestinationPath "$env:RUNNER_TEMP\protoc" -Force
          "$env:RUNNER_TEMP\protoc\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:RUNNER_TEMP\protoc\bin\protoc.exe" --version
      - name: Test Windows dependency guard
        run: |
          pwsh -File .github/scripts/test-windows-runtime-dependencies.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File .github/scripts/test-windows-import-exports.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File .github/scripts/test-windows-export-baseline.ps1
      - name: Test Windows export linker
        run: >
          pwsh -File .github/scripts/test-windows-export-linker.ps1
          -Architecture ARM64
          -WorkDir "$env:RUNNER_TEMP\windows arm64 export linker"
      - name: Test prebuilt CRT metadata
        run: >
          cmake "-DTEST_ROOT=$env:RUNNER_TEMP\prebuilt-crt"
          "-DTEST_GENERATOR=Visual Studio 18 2026" -DTEST_PLATFORM=ARM64
          -DTEST_TOOLSET=ClangCL -P cmake/test_prebuilt_crt.cmake
      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 18 2026" -A ARM64 -T ClangCL
          -DCMAKE_BUILD_TYPE=Release -DLANCE_C_CRT_STATIC=ON
      - name: Assert ARM64 ClangCL configuration
        shell: pwsh
        run: |
          $cache = Get-Content -LiteralPath build\CMakeCache.txt
          if ($cache -notcontains 'CMAKE_GENERATOR:INTERNAL=Visual Studio 18 2026') {
            throw 'CMake did not select Visual Studio 18 2026'
          }
          if ($cache -notcontains 'CMAKE_GENERATOR_PLATFORM:INTERNAL=ARM64') {
            throw 'CMake did not select the ARM64 platform'
          }
          if (-not ($cache -match '^CMAKE_GENERATOR_TOOLSET(?::[^=]+)?=ClangCL$')) {
            throw 'CMake did not select the ClangCL toolset'
          }
          $compilerFiles = @(
            Get-ChildItem -LiteralPath build\CMakeFiles -Recurse `
              -Filter CMakeCCompiler.cmake | Select-Object -First 1
            Get-ChildItem -LiteralPath build\CMakeFiles -Recurse `
              -Filter CMakeCXXCompiler.cmake | Select-Object -First 1
          )
          if ($compilerFiles.Count -ne 2 -or $compilerFiles -contains $null) {
            throw 'CMake did not emit both C and CXX compiler configuration files'
          }
          foreach ($compilerFile in $compilerFiles) {
            $compilerConfig = Get-Content -LiteralPath $compilerFile.FullName -Raw
            if ($compilerConfig -notmatch
                'set\(CMAKE_C(?:XX)?_COMPILER_ID "Clang"\)') {
              throw "CMake compiler ID is not Clang in $($compilerFile.FullName)"
            }
            if ($compilerConfig -notmatch
                '(?i)set\(CMAKE_C(?:XX)?_COMPILER ".*[/\\]Llvm[/\\]Arm64[/\\]bin[/\\]clang-cl\.exe"\)') {
              throw "CMake compiler is not the Visual Studio ARM64 clang-cl: $($compilerFile.FullName)"
            }
          }
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Install to staging prefix
        run: cmake --install build --prefix stage --config Release
      - name: Verify staged package and installed consumers
        run: >
          pwsh -File .github/scripts/verify-windows-staging.ps1
          -Prefix stage -SourceRoot .
          -WorkDir "$env:RUNNER_TEMP\lance-c-windows-arm64-acceptance"
          -Architecture ARM64 -CMakeGenerator "Visual Studio 18 2026"
          -CMakeToolset ClangCL
          -AbiBaseline ".github/abi-baseline/v0.2.0-exports.txt"
      - name: Run Rust tests
        run: cargo test
      - name: Run C/C++ compilation tests
        run: cargo test --test compile_and_run_test -- --ignored
      - name: Upload staged package
        uses: actions/upload-artifact@v4
        with:
          name: lance-c-windows-aarch64-pc-windows-msvc
          path: stage
          if-no-files-found: error
          retention-days: 14

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:d086f64cddcace250ef0f0073583c51b8298159303290a730c9f59bd91edfd2c
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-protoc
      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  api-docs:
    name: API docs (Doxygen)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Doxygen
        run: bash .github/scripts/install-doxygen.sh
      - name: Render and validate the public API reference
        run: bash .github/scripts/check-doxygen.sh

  msrv:
    name: MSRV (1.95.0)
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:d086f64cddcace250ef0f0073583c51b8298159303290a730c9f59bd91edfd2c
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-protoc
      - name: Check MSRV
        run: cargo check --all-targets

  license-headers:
    name: License headers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust files for SPDX headers
        run: |
          MISSING=""
          for f in $(find src tests -name '*.rs'); do
            if ! head -2 "$f" | grep -q 'SPDX-License-Identifier'; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "Missing SPDX license header in:$MISSING"
            exit 1
          fi

  abi-types:
    name: ABI types (v0.2.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install libabigail
        run: sudo apt-get update && sudo apt-get install -y abigail-tools
      - name: Compare public C types with v0.2.0
        run: bash .github/scripts/verify-abi-types.sh
