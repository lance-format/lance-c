name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "Doxyfile"
      - "include/lance/**"
      - ".github/scripts/install-doxygen.sh"
      - ".github/scripts/check-doxygen.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Doxyfile"
      - "include/lance/**"
      - ".github/scripts/install-doxygen.sh"
      - ".github/scripts/check-doxygen.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-docs:
    name: Build API docs (Doxygen)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Doxygen
        run: bash .github/scripts/install-doxygen.sh

      - name: Render and validate the public API reference
        run: bash .github/scripts/check-doxygen.sh

      - name: Upload documentation artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: build/doxygen/html
          retention-days: 7

      - name: Upload artifact to Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/doxygen/html

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
