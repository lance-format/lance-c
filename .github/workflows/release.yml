name: Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without leading 'v')"
        required: true

permissions:
  contents: write   # needed for softprops/action-gh-release

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }}${{ matrix.artifact_suffix }})
    runs-on: ${{ matrix.os }}
    container:
      # An expression evaluating to empty means "no container" — the job runs
      # directly on the runner. A literal `image: ''` fails schema validation,
      # but an expression does not, which is what makes this pattern work.
      image: ${{ matrix.container }}
    timeout-minutes: ${{ matrix.timeout_minutes || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:d086f64cddcace250ef0f0073583c51b8298159303290a730c9f59bd91edfd2c
            target: x86_64-unknown-linux-gnu
            artifact_suffix: ""
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:34a5e614a4eb26f73f8bf44cbbf2acf8011620453d03ea35a58537bb3cde44de
            target: aarch64-unknown-linux-gnu
            artifact_suffix: ""
          - os: macos-15
            container: ""
            target: aarch64-apple-darwin
            artifact_suffix: ""
            architecture: arm64
    env:
      CC: clang
      CXX: clang++
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Load baseline floors
        shell: bash
        run: |
          set -a
          source .github/baseline.env
          set +a
          {
            echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
          } >>"$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build/cargo/build"
          # Suffix keeps the container and host builds of the same triple from
          # sharing a cache — they link against different glibc versions.
          key: ${{ matrix.target }}${{ matrix.artifact_suffix }}
      - name: Install protobuf (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-protoc
      - name: Install Clang 20 (Linux)
        if: runner.os == 'Linux'
        run: |
          manylinux-install-clang -v 20.1.8.0
      - name: Install protobuf (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Record macOS host and toolchain
        if: runner.os == 'macOS'
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          "$CC" --version
          rustc -vV
          cargo --version
          cmake --version
          git rev-parse HEAD
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >>"$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          fi
      - name: Configure + build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build --parallel
      - name: Install to staging prefix
        run: cmake --install build --prefix stage
      - name: Strip release shared library
        run: bash .github/scripts/strip-release-shared.sh stage "${{ runner.os }}"
      - name: Verify Linux shared-library exports
        if: runner.os == 'Linux'
        run: bash .github/scripts/verify-shared-exports.sh stage/lib/liblance_c.so stage/include/lance/lance.h linux
      - name: Verify macOS shared-library exports
        if: runner.os == 'macOS'
        run: bash .github/scripts/verify-shared-exports.sh stage/lib/liblance_c.dylib stage/include/lance/lance.h macos
      - name: Verify Linux staged runtime dependencies
        if: runner.os == 'Linux'
        run: bash .github/scripts/verify-linux-staging.sh stage ${{ matrix.target }}
      - name: Verify macOS staged libraries
        if: runner.os == 'macOS'
        run: bash .github/scripts/verify-macos-staging.sh stage ${{ matrix.architecture }}
      - name: Smoke-test staged package with CMake consumer
        run: bash .github/scripts/verify-cmake-consumer.sh --from-install-prefix stage
      - name: Tar
        id: pack
        env:
          XZ_OPT: -T0
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          TARGET=${{ matrix.target }}
          SUFFIX=${{ matrix.artifact_suffix }}
          ARCHIVE="lance-c-v${VERSION}-${TARGET}${SUFFIX}.tar.xz"
          tar -C stage -cJf "${ARCHIVE}" .
          if command -v shasum > /dev/null 2>&1; then
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
            shasum -a 512 "${ARCHIVE}" > "${ARCHIVE}.sha512"
          else
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
            sha512sum "${ARCHIVE}" > "${ARCHIVE}.sha512"
          fi
          echo "archive=${ARCHIVE}" >>"$GITHUB_OUTPUT"
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}${{ matrix.artifact_suffix }}
          path: |
            ${{ steps.pack.outputs.archive }}
            ${{ steps.pack.outputs.archive }}.sha256
            ${{ steps.pack.outputs.archive }}.sha512
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            generator: Visual Studio 17 2022
            architecture: x64
            toolset: ""
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            generator: Visual Studio 18 2026
            architecture: ARM64
            toolset: ClangCL
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Enable long paths for Lance dependency checkout
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Corrosion writes dependencies under the CMake build tree.
          workspaces: |
            . -> target
            . -> build/${{ matrix.architecture }}/Release/cargo/build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Assert native Windows ARM64 toolchain
        if: matrix.architecture == 'ARM64'
        shell: pwsh
        run: pwsh -File .github/scripts/assert-windows-arm64-host.ps1
      - name: Record Windows runtime baseline
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, OSArchitecture |
            Format-List
          rustc --version --verbose
          cargo --version
          cmake --version
      - name: Install protoc
        shell: pwsh
        run: |
          $version = '29.3'
          $archive = "protoc-$version-win64.zip"
          Invoke-WebRequest `
            "https://github.com/protocolbuffers/protobuf/releases/download/v$version/$archive" `
            -OutFile "$env:RUNNER_TEMP\$archive"
          Expand-Archive "$env:RUNNER_TEMP\$archive" `
            -DestinationPath "$env:RUNNER_TEMP\protoc" -Force
          "$env:RUNNER_TEMP\protoc\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:RUNNER_TEMP\protoc\bin\protoc.exe" --version
      - name: Configure
        run: >
          cmake -S . -B build -G "${{ matrix.generator }}"
          -A ${{ matrix.architecture }}
          ${{ matrix.toolset != '' && format('-T {0}', matrix.toolset) || '' }}
          -DCMAKE_BUILD_TYPE=Release -DLANCE_C_CRT_STATIC=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Install to staging prefix
        run: cmake --install build --prefix stage --config Release
      - name: Verify staged package and installed consumers
        run: >
          pwsh -File .github/scripts/verify-windows-staging.ps1
          -Prefix stage -SourceRoot .
          -WorkDir "$env:RUNNER_TEMP\lance-c-windows-${{ matrix.architecture }}-acceptance"
          -Architecture ${{ matrix.architecture }}
          -CMakeGenerator "${{ matrix.generator }}"
          -CMakeToolset "${{ matrix.toolset }}"
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Tar
        id: pack
        shell: bash
        env:
          XZ_OPT: -T0
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          TARGET=${{ matrix.target }}
          ARCHIVE="lance-c-v${VERSION}-${TARGET}.tar.xz"
          tar -C stage -cJf "${ARCHIVE}" .
          if command -v shasum > /dev/null 2>&1; then
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
            shasum -a 512 "${ARCHIVE}" > "${ARCHIVE}.sha512"
          else
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
            sha512sum "${ARCHIVE}" > "${ARCHIVE}.sha512"
          fi
          echo "archive=${ARCHIVE}" >>"$GITHUB_OUTPUT"
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.pack.outputs.archive }}
            ${{ steps.pack.outputs.archive }}.sha256
            ${{ steps.pack.outputs.archive }}.sha512
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [build, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >>"$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Aggregate SHA512SUMS
        run: |
          cd dist
          cat *.sha512 > SHA512SUMS
          ls -lah
      - name: Emit recipe-update snippet
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd dist
          echo "## Suggested recipe updates" > recipe-snippets.md
          echo '```cmake' >> recipe-snippets.md
          echo '# ports/lance-c/portfile.cmake — paste these set() lines' >> recipe-snippets.md
          bash ../.github/scripts/release-recipe-snippet.sh . "$VERSION" >> recipe-snippets.md
          echo '```' >> recipe-snippets.md
          cat recipe-snippets.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.xz
            dist/*.sha256
            dist/*.sha512
            dist/SHA512SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
