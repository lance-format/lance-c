name: CRT static diagnostic

on:
  push:
    branches:
      - xuanwo/windows-static-crt-release

permissions:
  contents: read

jobs:
  x64:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Build and inspect the /MT consumer
        shell: pwsh
        run: pwsh -File experiments/crt-static-probe/run-probe.ps1
