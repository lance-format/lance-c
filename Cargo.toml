[package]
name = "lance-c"
version = "0.1.9"
edition = "2024"
authors = ["Lance Devs <dev@lance.org>"]
license = "Apache-2.0"
repository = "https://github.com/lance-format/lance-c"
readme = "README.md"
description = "C/C++ bindings for the Lance columnar data format"
keywords = ["lance", "ffi", "c", "cpp", "arrow"]
categories = ["database-implementations", "external-ffi-bindings"]
rust-version = "1.91.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Direct for the `#[async_trait::async_trait]` impl of lance's
# `lance_index::progress::IndexBuildProgress`; already in the graph
# transitively via lance-index.
async-trait = "0.1"
lance = { git = "https://github.com/lance-format/lance.git", rev = "356acb0d333c96e970f6f84b97314fc5bc4193f7", features = ["substrait"] }
lance-core = { git = "https://github.com/lance-format/lance.git", rev = "356acb0d333c96e970f6f84b97314fc5bc4193f7" }
lance-file = { git = "https://github.com/lance-format/lance.git", rev = "356acb0d333c96e970f6f84b97314fc5bc4193f7" }
lance-index = { git = "https://github.com/lance-format/lance.git", rev = "356acb0d333c96e970f6f84b97314fc5bc4193f7" }
lance-io = { git = "https://github.com/lance-format/lance.git", rev = "356acb0d333c96e970f6f84b97314fc5bc4193f7" }
lance-linalg = { git = "https://github.com/lance-format/lance.git", rev = "356acb0d333c96e970f6f84b97314fc5bc4193f7" }
lance-table = { git = "https://github.com/lance-format/lance.git", rev = "356acb0d333c96e970f6f84b97314fc5bc4193f7" }
lance-datafusion = { git = "https://github.com/lance-format/lance.git", rev = "356acb0d333c96e970f6f84b97314fc5bc4193f7", features = ["substrait"] }
datafusion = { version = "54.0.0", default-features = false }
arrow = { version = "58.0.0", features = ["prettyprint", "ffi"] }
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
# Direct to name `chrono::TimeDelta` (the field type of lance's public
# `AutoCleanupParams`) and `chrono::DateTime`/`Utc` (index metadata
# timestamps); already in the graph transitively via lance.
chrono = { version = "0.4", default-features = false }
half = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
futures = "0.3"
log = "0.4"
libc = "0.2"
# Explicitly install the HTTP transport when embedded in a static C/C++ executable.
opendal = { version = "=0.58.2", default-features = false, features = ["http-transport-reqwest"] }
pin-project = "1.0"
prost = "0.14"
snafu = "0.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
lance = { git = "https://github.com/lance-format/lance.git", rev = "356acb0d333c96e970f6f84b97314fc5bc4193f7", features = ["substrait"] }
lance-datagen = { git = "https://github.com/lance-format/lance.git", rev = "356acb0d333c96e970f6f84b97314fc5bc4193f7" }
lance-file = { git = "https://github.com/lance-format/lance.git", rev = "356acb0d333c96e970f6f84b97314fc5bc4193f7" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
tempfile = "3"
# Direct for `libc::SIGABRT` in the panic-guard test's child-process assertions;
# already in the graph transitively via tokio/lance.
libc = "0.2"

[package.metadata.capi.header]
subdirectory = "lance"
generation = false  # we ship a hand-maintained header at include/lance/lance.h

[package.metadata.capi.pkg_config]
name = "lance-c"
filename = "lance-c"
description = "C/C++ bindings for the Lance columnar data format"

[package.metadata.capi.library]
name = "lance_c"
versioning = false  # 0.x ABI is unstable; revisit at 1.0
