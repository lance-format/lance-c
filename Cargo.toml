[package]
name = "lance-c"
version = "0.1.9"
edition = "2024"
authors = ["Lance Devs <dev@lance.org>"]
license = "Apache-2.0"
repository = "https://github.com/lance-format/lance-c"
readme = "README.md"
description = "C/C++ bindings for the Lance columnar data format"
keywords = ["lance", "ffi", "c", "cpp", "arrow"]
categories = ["database-implementations", "external-ffi-bindings"]
rust-version = "1.95.0"

[build-dependencies]
cc = "1"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Direct for the `#[async_trait::async_trait]` impl of lance's
# `lance_index::progress::IndexBuildProgress`; already in the graph
# transitively via lance-index.
async-trait = "0.1"
bytes = "1"
# Keep every Lance crate on the upstream v15.0.0-beta.19 release commit.
lance = { git = "https://github.com/lancedb/lance.git", rev = "98f84091db531775ab03fa7edb3d34c86937fbf5", features = ["substrait"] }
# Direct to reuse the native Binary/LargeBinary/BinaryView/FixedSizeBinary iterator.
lance-arrow = { git = "https://github.com/lancedb/lance.git", rev = "98f84091db531775ab03fa7edb3d34c86937fbf5" }
lance-core = { git = "https://github.com/lancedb/lance.git", rev = "98f84091db531775ab03fa7edb3d34c86937fbf5" }
lance-encoding = { git = "https://github.com/lancedb/lance.git", rev = "98f84091db531775ab03fa7edb3d34c86937fbf5" }
lance-file = { git = "https://github.com/lancedb/lance.git", rev = "98f84091db531775ab03fa7edb3d34c86937fbf5" }
lance-index = { git = "https://github.com/lancedb/lance.git", rev = "98f84091db531775ab03fa7edb3d34c86937fbf5" }
lance-io = { git = "https://github.com/lancedb/lance.git", rev = "98f84091db531775ab03fa7edb3d34c86937fbf5" }
lance-linalg = { git = "https://github.com/lancedb/lance.git", rev = "98f84091db531775ab03fa7edb3d34c86937fbf5" }
# Native namespace trait, models, directory/REST implementations and REST adapter.
# Same upstream pin as every other Lance crate; credential-vendor features stay off.
lance-namespace = { git = "https://github.com/lancedb/lance.git", rev = "98f84091db531775ab03fa7edb3d34c86937fbf5" }
lance-namespace-impls = { git = "https://github.com/lancedb/lance.git", rev = "98f84091db531775ab03fa7edb3d34c86937fbf5", features = ["rest", "rest-adapter", "dir-goosefs"] }
# Direct to name `NullableIndexExprResult` in the segment-scoped
# `ScalarIndexLoader` adapter; already in the graph transitively via lance-index.
lance-select = { git = "https://github.com/lancedb/lance.git", rev = "98f84091db531775ab03fa7edb3d34c86937fbf5" }
lance-table = { git = "https://github.com/lancedb/lance.git", rev = "98f84091db531775ab03fa7edb3d34c86937fbf5" }
lance-datafusion = { git = "https://github.com/lancedb/lance.git", rev = "98f84091db531775ab03fa7edb3d34c86937fbf5", features = ["substrait"] }
datafusion = { version = "55.0.0", default-features = false }
arrow = { version = "59.2.0", features = ["prettyprint", "ffi"] }
arrow-array = "59.2.0"
arrow-schema = "59.2.0"
# Direct to name `chrono::TimeDelta` (the field type of lance's public
# `AutoCleanupParams`) and `chrono::DateTime`/`Utc` (index metadata
# timestamps); already in the graph transitively via lance.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
half = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "io-util"] }
futures = "0.3"
log = "0.4"
libc = "0.2"
# Direct for native object-store paths and raw-file sessions.
object_store = "=0.14.2"
# Explicitly install the HTTP transport when embedded in a static C/C++ executable.
opendal = { version = "=0.59.2", default-features = false, features = ["http-transport-reqwest"] }
pin-project = "1.0"
prost = "0.14"
# Direct for native Rewrite index details and key-existence filter transport.
prost-types = "0.14"
# Direct for portable overlay coverage and native UpdatedFragmentOffsets.
roaring = "0.11"
# Direct JSON transport for native maintenance plan/task/result values.
serde = "1"
serde_json = "1"
snafu = "0.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
lance = { git = "https://github.com/lancedb/lance.git", rev = "98f84091db531775ab03fa7edb3d34c86937fbf5", features = ["substrait"] }
lance-datagen = { git = "https://github.com/lancedb/lance.git", rev = "98f84091db531775ab03fa7edb3d34c86937fbf5" }
lance-file = { git = "https://github.com/lancedb/lance.git", rev = "98f84091db531775ab03fa7edb3d34c86937fbf5" }
datafusion-substrait = { version = "=55.0.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
arrow-array = "59.2.0"
arrow-schema = "59.2.0"
tempfile = "3"
# Direct for `libc::SIGABRT` in the panic-guard test's child-process assertions;
# already in the graph transitively via tokio/lance.
libc = "0.2"

[package.metadata.capi.header]
subdirectory = "lance"
generation = false  # we ship a hand-maintained header at include/lance/lance.h

[package.metadata.capi.pkg_config]
name = "lance-c"
filename = "lance-c"
description = "C/C++ bindings for the Lance columnar data format"

[package.metadata.capi.library]
name = "lance_c"
versioning = false  # 0.x ABI is unstable; revisit at 1.0
